# N'autorise que le trafic entrant vers le port 8000 de l'API.
# Appliquée par le contrôleur de network policy intégré à k3s (actif par défaut).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: demo-api-ingress
  namespace: devsecops-demo
spec:
  podSelector:
    matchLabels:
      app: demo-api
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 8000
          protocol: TCP
