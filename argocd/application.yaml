# Application Argo CD : synchronise le dossier k8s/ de la branche main avec le cluster.
# À appliquer une seule fois, après l'installation d'Argo CD (voir README).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-api
  namespace: argocd
spec:
  project: default
  source:
    # Lecture en SSH avec une deploy key en lecture seule (Secret argocd/repo-devsecops-platform, voir README).
    # Le dépôt est public : la clé n'est pas indispensable, elle limite l'accès au strict nécessaire et
    # permet de repasser le dépôt en privé sans rien changer côté cluster.
    repoURL: git@github.com:CubicPotato/devsecops-platform.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: devsecops-demo
  syncPolicy:
    automated:
      prune: true # supprime du cluster ce qui a été retiré de Git
      selfHeal: true # annule toute modification faite à la main dans le cluster
